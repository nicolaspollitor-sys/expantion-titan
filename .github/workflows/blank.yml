
name: Compilar Titanfall Ultimate Expansion

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar mod
        run: gradle build --no-daemon --stacktrace

      - name: Verificar archivos JAR
        run: |
          echo "Archivos generados:"
          ls -lah build/libs/
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Guardar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titanfall-Ultimate-Expansion-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
